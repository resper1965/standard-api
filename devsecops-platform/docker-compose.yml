version: '3.8'

services:
  # O DefectDojo já existe remotamente perante as especificações.
  # Adicionamos aqui apenas serviços complementares úteis para a trilha de DevSecOps, como SonarQube.

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-community
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - devsecops-network
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: sonarqube-db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - postgresql:/var/lib/postgresql
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - devsecops-network

  # OWASP Threat Dragon (Threat Modeling)
  threatdragon:
    image: owasp/threat-dragon:latest
    container_name: threat-dragon
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    networks:
      - devsecops-network

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql:
  postgresql_data:

networks:
  devsecops-network:
    driver: bridge
