name: 🐛 Bug Report
description: Report a bug in the Standard API
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the details below.

  - type: input
    id: endpoint
    attributes:
      label: Affected Endpoint / Component
      description: "e.g., GET /api/v1/scf/frameworks, packages/assessment-engine"
      placeholder: "GET /api/v1/..."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. Send request to '...'
        2. With headers '...'
        3. Observe error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include HTTP status codes, error messages, trace_ids.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (production down, data loss)
        - High (major feature broken)
        - Medium (feature degraded)
        - Low (cosmetic, minor)
    validations:
      required: true

  - type: input
    id: trace_id
    attributes:
      label: Trace ID
      description: "From the API response header or body (if available)"
      placeholder: "a06bdef18ff7cf1d"

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Environment, tenant ID, screenshots, logs, etc.
