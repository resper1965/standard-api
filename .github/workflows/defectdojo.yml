name: DefectDojo

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  semgrep-defectdojo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Semgrep Scan
        # Usamos o container para evitar demoras na instação com pip
        run: docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config auto --json -o /src/semgrep.json --error
          
      - name: Enviar para DefectDojo
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_ENGAGEMENT: ${{ vars.DEFECTDOJO_ENGAGEMENT_ID || '2' }}
        run: |
          if [ -z "$DD_URL" ] || [ -z "$DD_KEY" ]; then
            echo "::warning::DEFECTDOJO secrets ausentes ou contexto de fork bloqueado. Ignorando upload."
            exit 0
          fi

          echo "Lançando relatório ao DefectDojo..."
          curl -f -sS -X POST \
            -H "Authorization: Token ${DD_KEY}" \
            -F "engagement=${DD_ENGAGEMENT}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "active=true" \
            -F "verified=false" \
            -F "file=@semgrep.json" \
            "${DD_URL}/api/v2/import-scan/"
