name: Deploy Staging (DISABLED)

# Staging environment is not used — all deployments go directly to production.
# This workflow is kept for reference but will not run automatically.
# See: docs/operations/environments.md

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type STAGING to confirm (staging is disabled by default)'
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare staging
    if: github.event.inputs.confirm == 'STAGING'
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Release candidate validation
        run: pnpm test:ci

      - name: Deploy workflows
        run: pnpm exec wrangler deploy -c infra/cloudflare/wrangler.workflows.toml -e staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy API gateway
        run: pnpm exec wrangler deploy -c infra/cloudflare/wrangler.api-gateway.toml -e staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy ingestion worker
        run: pnpm exec wrangler deploy -c infra/cloudflare/wrangler.ingestion-worker.toml -e staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy KB worker
        run: pnpm exec wrangler deploy -c infra/cloudflare/wrangler.kb-worker.toml -e staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy reporting worker
        run: pnpm exec wrangler deploy -c infra/cloudflare/wrangler.reporting-worker.toml -e staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
