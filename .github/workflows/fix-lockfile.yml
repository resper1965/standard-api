name: Fix Lockfile

# This workflow commits a regenerated lockfile, so it genuinely needs write.
# Declared explicitly rather than inherited, so the scope is visible and
# reviewable instead of defaulting to every scope the repository allows.
permissions:
  contents: write


on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  fix-lockfile:
    name: Regenerate pnpm-lock.yaml
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --staged --quiet; then
            echo "Lockfile already up to date"
          else
            git commit -m "chore: regenerate pnpm-lock.yaml [skip ci]"
            git push
          fi
