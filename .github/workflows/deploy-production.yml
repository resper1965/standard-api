name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  validate:
    name: Pre-Deploy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint || true

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & Contract Tests
        run: pnpm test:unit && pnpm test:contracts

      - name: Security Audit
        run: pnpm audit --audit-level=high || true

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    environment: production
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Migrate Database
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    needs: migrate
    strategy:
      max-parallel: 1
      matrix:
        worker:
          - workflows
          - api-gateway
          - ingestion-worker
          - kb-worker
          - reporting-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Install wrangler globally
        run: npm install -g wrangler@latest

      - name: Deploy ${{ matrix.worker }}
        run: wrangler deploy -c infra/cloudflare/wrangler.${{ matrix.worker }}.toml -e production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for propagation
        run: sleep 30

      - name: Health check — API Gateway (Custom Domain)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://standard-api.bekaa.eu/health)
          echo "standard-api.bekaa.eu /health returned: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::warning::Custom Domain smoke test FAILED — standard-api.bekaa.eu not healthy (may be DNS propagation)"
          else
            echo "✅ Custom Domain is healthy"
          fi

      - name: Health check — Worker Domain (authoritative)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://standard-api-gateway-production.ness.workers.dev/health)
          echo "Worker domain /health returned: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Worker Domain Smoke test FAILED — pipeline blocked"
            exit 1
          fi
          echo "✅ Worker domain is healthy"
