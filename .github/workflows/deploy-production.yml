name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  validate:
    name: Pre-Deploy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & Contract Tests
        run: pnpm test:unit && pnpm test:contracts

      - name: Security Audit
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

  deploy-frontend:
    name: Deploy Frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @standard/sdk build

      - name: Build Web App
        run: pnpm --filter @standard/web build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy Frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=standard-web-production

  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    environment: production
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run Database Migrations
        run: pnpm --filter @standard/schemas tsx migrate.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    needs: migrate
    strategy:
      max-parallel: 1
      matrix:
        worker:
          - workflows
          - api-gateway
          - queues-worker
          - ingestion-worker
          - kb-worker
          - reporting-worker

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install wrangler globally
        run: npm install -g wrangler@latest

      - name: Deploy ${{ matrix.worker }}
        run: wrangler deploy -c infra/cloudflare/wrangler.${{ matrix.worker }}.toml -e production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for propagation
        run: sleep 30

      - name: Health check — API Gateway (Authoritative)
        run: |
          HTTP_STATUS=$(curl -A "standard-api-ci/1.0" -s -o /dev/null -w "%{http_code}" https://standard-api.bekaa.eu/health)
          echo "standard-api.bekaa.eu /health returned: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::API Gateway Smoke test FAILED — standard-api.bekaa.eu not healthy"
            exit 1
          fi
          echo "✅ Custom Domain is healthy"

      - name: Auth stack health check — /api/health/auth
        # ADR-AUTH-001: This gate verifies DB connectivity for the Standard Native Auth stack.
        # A 503 here means the auth layer cannot reach the database — logins will fail.
        # Never bypass this gate for production deploys.
        run: |
          AUTH_STATUS=$(curl -A "standard-api-ci/1.0" -s -o /dev/null -w "%{http_code}" https://standard-api.bekaa.eu/api/health/auth)
          echo "/api/health/auth returned: $AUTH_STATUS"
          if [ "$AUTH_STATUS" -ne 200 ]; then
            echo "::error::Auth stack health check FAILED (status=$AUTH_STATUS) — logins may be broken"
            exit 1
          fi
          echo "✅ Auth stack is healthy"
