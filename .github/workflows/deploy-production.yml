name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.0.0'

jobs:
  validate:
    name: Pre-Deploy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint || true

      - name: Typecheck
        run: pnpm typecheck || true

      - name: Unit & Contract Tests
        run: pnpm test:unit && pnpm test:contracts || true

      - name: Security Audit
        run: pnpm audit --audit-level=high || true

      - name: Build
        run: pnpm build
        env:
          VITE_NEON_AUTH_URL: https://ep-blue-breeze-anyfua57.neonauth.c-6.us-east-1.aws.neon.tech/neondb/auth

  deploy-workers:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    needs: validate
    strategy:
      max-parallel: 1
      matrix:
        worker: 
          - workflows
          - api-gateway
          - ingestion-worker
          - kb-worker
          - reporting-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Deploy ${{ matrix.worker }}
        run: pnpm exec wrangler deploy -c infra/cloudflare/wrangler.${{ matrix.worker }}.toml -e production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    environment: production
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build Frontend
        run: pnpm --filter @standard/web build
        env:
          VITE_NEON_AUTH_URL: https://ep-blue-breeze-anyfua57.neonauth.c-6.us-east-1.aws.neon.tech/neondb/auth
          VITE_API_URL: https://standard-api-gateway-production.ness.workers.dev
          VITE_NEON_DATA_API_URL: https://ep-blue-breeze-anyfua57.apirest.c-6.us-east-1.aws.neon.tech/neondb/rest/v1

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy apps/web/dist --project-name=standard-web --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-workers, deploy-frontend]
    steps:
      - name: Wait for cold start
        run: sleep 15

      - name: Health check — API Gateway
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://standard-api-gateway-production.ness.workers.dev/health)
          echo "API Gateway /health returned: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Smoke test FAILED — API Gateway is not healthy"
            exit 1
          fi
          echo "✅ API Gateway is healthy"

      - name: Fetch health details
        run: |
          curl -sf https://standard-api-gateway-production.ness.workers.dev/health | jq . || echo "Could not parse health response"

      - name: Verify frontend is accessible
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://standard.bekaa.eu/)
          echo "Frontend returned: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::warning::Frontend returned $HTTP_STATUS"
          else
            echo "✅ Frontend is accessible"
          fi
