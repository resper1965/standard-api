name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Blocking: API Gateway lint must pass on every PR.
      - name: Lint — API Gateway (blocking)
        run: pnpm --filter @standard/api-gateway lint

      # Blocking: react-refresh lint errors resolved (line-level suppresses applied).
      - name: Lint — Web (blocking)
        run: pnpm --filter @standard/web lint

      - name: Typecheck
        run: pnpm typecheck

  test-fast:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit Tests
        run: pnpm test:unit

      # Non-blocking: contract tests require wrangler/miniflare CF environment.
      # Tracked: needs CF_ACCOUNT_ID + D1 binding in CI secrets to become blocking.
      - name: Contract Tests
        run: pnpm test:contracts
        continue-on-error: true

  # Heavy tests: security, regression, evaluations, synthetic-e2e.
  # All require wrangler/miniflare CF environment — non-blocking until CF CI env is set up.
  test-heavy:
    name: Regression, Ev & E2E
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-fast]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Security Tests
        run: pnpm test:security
        continue-on-error: true

      - name: Regression Tests
        run: pnpm test:regression
        continue-on-error: true

      - name: Agent Evaluations
        run: pnpm test:evaluations
        continue-on-error: true

      - name: Synthetic E2E Tests
        run: pnpm test:synthetic-e2e
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-fast]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm build
