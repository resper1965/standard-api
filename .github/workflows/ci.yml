name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          # cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Blocking: API Gateway lint must pass on every PR.
      - name: Lint — API Gateway (blocking)
        run: pnpm --filter @standard/api-gateway lint

      # Blocking: react-refresh lint errors resolved (line-level suppresses applied).
      - name: Lint — Web (blocking)
        run: pnpm --filter @standard/web lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate OpenAPI Spec (blocking)
        run: pnpm dlx tsx scripts/validate-openapi.ts

      # A .sql file with no journal entry is never applied by the deploy runner.
      # This is how migrations 0049-0057 went missing (2026-08-26 audit, C-01).
      - name: Validate migration journal (blocking)
        run: node scripts/check-migration-journal.mjs

  test-fast:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          # cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit Tests
        run: pnpm test:unit

      # Blocking: contract tests exercise the real HTTP edge (createApp +
      # app.fetch) against in-memory adapters — no CF/wrangler/DB required.
      # They guard the golden-path regressions (e.g. API key creation) that
      # previously only surfaced in the browser.
      - name: Contract Tests (blocking)
        run: pnpm test:contracts

  # Heavy tests: security, regression, evaluations, synthetic-e2e.
  # All require wrangler/miniflare CF environment — non-blocking until CF CI env is set up.
  test-heavy:
    name: Regression, Ev & E2E
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-fast]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          # cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @standard/sdk build

      - name: Security Tests
        run: pnpm test:security

      - name: Regression Tests
        run: pnpm test:regression

      - name: Agent Evaluations
        run: pnpm test:evaluations

      - name: Synthetic E2E Tests
        run: pnpm test:synthetic-e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-fast]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          # cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm build
