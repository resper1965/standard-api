name: Release Please and SBOM

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Manifest mode. With bare `release-type: node`, release-please infers
          # state by walking history for its own previous release commits — and
          # it lost the thread: PR #101 sat open since 2026-06-22 proposing
          # 1.0.0 while v1.2.2 had already shipped on 2026-06-03, so no release
          # went out for ~3 months. The manifest states the version explicitly
          # instead of inferring it.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # If a release was created, generate an SBOM and attach it to the release
      - name: Checkout Repository
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install pnpm
        if: ${{ steps.release.outputs.release_created }}
        run: npm install -g pnpm@9.15.9

      - name: Generate SBOM
        if: ${{ steps.release.outputs.release_created }}
        run: npx @appthreat/cdxgen -o bom.json -t javascript

      - name: Upload SBOM to Release
        if: ${{ steps.release.outputs.release_created }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: bom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
