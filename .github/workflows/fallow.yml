# ──────────────────────────────────────────────────────────────────────
# Fallow — Codebase Intelligence for TypeScript/JavaScript
# https://github.com/marketplace/actions/fallow-codebase-intelligence
#
# Deterministic static analysis: unused code, duplication, circular deps,
# complexity hotspots, and architecture boundary drift.
# Rust-native, sub-second, zero-config framework support.
# ──────────────────────────────────────────────────────────────────────

name: Fallow Codebase Intelligence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # For PR comments with analysis results

concurrency:
  group: fallow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Full Codebase Health Report (main only) ──────────────────────
  codebase-health:
    name: "🌾 Codebase Health Report"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0  # Full history for hotspot analysis

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Run Fallow Health Analysis
        run: npx -y fallow health --format json > fallow-health.json || true

      - name: Run Fallow Full Analysis
        run: npx -y fallow --format json > fallow-full.json || true

      - name: Upload Fallow Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fallow-codebase-report
          path: |
            fallow-health.json
            fallow-full.json
          retention-days: 30

  # ─── PR Risk Audit (PRs only) ─────────────────────────────────────
  pr-audit:
    name: "🔍 PR Risk Audit"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "9.15.9"

      - name: Install
        run: pnpm install --no-frozen-lockfile

      # Without real coverage the audit estimates CRAP from export references,
      # which reads every exported function as untested. Extracting a helper
      # then raises the score while the code gets simpler, and adding tests
      # does not lower it - three rounds on #131 chased findings that only
      # existed because of the estimate.
      # continue-on-error on purpose: this job scores complexity, it does not
      # gate coverage. The floors are enforced in the CI workflow's unit job;
      # here a threshold failure must still leave coverage-final.json behind
      # rather than abort the audit.
      - name: Collect coverage for CRAP scoring
        run: pnpm coverage
        continue-on-error: true

      - name: Run Fallow Audit on PR
        run: |
          if [ -f coverage/coverage-final.json ]; then
            npx -y fallow audit --coverage coverage/coverage-final.json
          else
            echo "::warning title=No coverage::Coverage was not produced; CRAP scores fall back to estimates from export references."
            npx -y fallow audit
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
