name: Preview Deployment (Neon + Cloudflare Pages)

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.9'

jobs:
  deploy-preview:
    name: Deploy Preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@dde14ac574a8b9b1cedc59a1cf312788af43d8d8

      # Neon branch names cannot contain nested slashes, and head refs routinely
      # do (claude/read-repository-xhmcav). Flatten to a single safe segment.
      - name: Compute Neon branch name
        id: neon_branch
        env:
          HEAD_REF: ${{ steps.branch_name.outputs.current_branch }}
        run: |
          SLUG=$(echo "${HEAD_REF}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9]#-#g; s#-\{2,\}#-#g; s#^-##; s#-$##' | cut -c1-40)
          echo "name=preview-pr-${{ github.event.number }}-${SLUG}" >> "${GITHUB_OUTPUT}"

      # The action creates the branch but does not reliably emit db_url* at this
      # pin (the log shows "created successfully" with an empty output). Build
      # the connection string from the Neon API instead, which is deterministic.
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ steps.neon_branch.outputs.name }}
          api_key: ${{ secrets.NEON_API_KEY }}
          role: ${{ vars.NEON_DB_ROLE || 'neondb_owner' }}
          database: ${{ vars.NEON_DB_NAME || 'neondb' }}

      - name: Resolve branch connection string
        id: neon_db
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_NAME: ${{ steps.neon_branch.outputs.name }}
          DB_ROLE: ${{ vars.NEON_DB_ROLE || 'neondb_owner' }}
          DB_NAME: ${{ vars.NEON_DB_NAME || 'neondb' }}
        run: |
          set -euo pipefail
          api() { curl -sS -f -H "Authorization: Bearer ${NEON_API_KEY}" "https://console.neon.tech/api/v2/$1"; }

          BRANCH_ID=$(api "projects/${PROJECT_ID}/branches" \
            | jq -r --arg n "${BRANCH_NAME}" '.branches[] | select(.name == $n) | .id' | head -n1)
          if [ -z "${BRANCH_ID}" ]; then
            echo "::error title=Neon branch missing::No branch named ${BRANCH_NAME} in project ${PROJECT_ID}."
            exit 1
          fi

          HOST=$(api "projects/${PROJECT_ID}/branches/${BRANCH_ID}/endpoints" \
            | jq -r '.endpoints[] | select(.type == "read_write") | .host' | head -n1)
          if [ -z "${HOST}" ]; then
            echo "::error title=No compute endpoint::Branch ${BRANCH_NAME} has no read_write endpoint."
            exit 1
          fi
          POOLED_HOST=$(echo "${HOST}" | sed 's#^\([^.]*\)\.#\1-pooler.#')

          PASSWORD=$(api "projects/${PROJECT_ID}/branches/${BRANCH_ID}/roles/${DB_ROLE}/reveal_password" \
            | jq -r '.password')
          if [ -z "${PASSWORD}" ] || [ "${PASSWORD}" = "null" ]; then
            echo "::error title=Role password unavailable::Could not reveal password for role ${DB_ROLE}."
            exit 1
          fi

          echo "::add-mask::${PASSWORD}"
          URL="postgresql://${DB_ROLE}:${PASSWORD}@${POOLED_HOST}/${DB_NAME}?sslmode=require"
          echo "::add-mask::${URL}"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"
          echo "Resolved pooled endpoint ${POOLED_HOST} for branch ${BRANCH_NAME}."

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Run Migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ steps.neon_db.outputs.url }}

      - name: Build Frontend
        run: pnpm --filter @standard/web build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy Preview to Cloudflare Pages
        id: cf_deploy
        run: |
          DEPLOY_OUTPUT=$(wrangler pages deploy apps/web/dist \
            --project-name=standard-web-production \
            --branch=${{ steps.branch_name.outputs.current_branch }} 2>&1)
          echo "$DEPLOY_OUTPUT"
          # wrangler prints both a deployment URL and an alias URL; taking both
          # made this a multi-line value, which GITHUB_OUTPUT rejects. Keep the
          # alias (last line) - it is stable across pushes to the same branch.
          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[^ ]*\.pages\.dev' | tail -n1)
          if [ -z "${PREVIEW_URL}" ]; then
            echo "::error title=No preview URL::wrangler printed no .pages.dev URL."
            exit 1
          fi
          echo "preview_url=${PREVIEW_URL}" >> "${GITHUB_OUTPUT}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@65f9e5c9a1f2cd378bd74b2e057c9736982a8e74
        with:
          message: |
            ## 🚀 Preview Deployment Ready

            | Resource | Link |
            |----------|------|
            | 🌐 Preview | ${{ steps.cf_deploy.outputs.preview_url }} |
            | 🗃️ Neon Branch | [preview/pr-${{ github.event.number }}](https://console.neon.tech/app/projects/${{ vars.NEON_PROJECT_ID }}/branches) |

            **Branch DB:** `${{ steps.neon_branch.outputs.name }}`
          comment-tag: preview-deployment

  cleanup-preview:
    name: Cleanup Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@dde14ac574a8b9b1cedc59a1cf312788af43d8d8

      # Must match the slug computed in deploy-preview, or cleanup silently
      # misses and preview branches accumulate in the Neon project.
      - name: Compute Neon branch name
        id: neon_branch
        env:
          HEAD_REF: ${{ steps.branch_name.outputs.current_branch }}
        run: |
          SLUG=$(echo "${HEAD_REF}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9]#-#g; s#-\{2,\}#-#g; s#^-##; s#-$##' | cut -c1-40)
          echo "name=preview-pr-${{ github.event.number }}-${SLUG}" >> "${GITHUB_OUTPUT}"

      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776
        continue-on-error: true
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon_branch.outputs.name }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Delete Cloudflare Pages Preview Deployments
        # Best-effort cleanup: a preview deployment left behind costs nothing and
        # must never fail the workflow that closes a PR.
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          BRANCH="${{ steps.branch_name.outputs.current_branch }}"
          PROJECT_NAME="standard-web-production"

          if [ -z "${CF_ACCOUNT_ID}" ] || [ -z "${CF_API_TOKEN}" ]; then
            echo "::notice::CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN not set - skipping preview cleanup."
            exit 0
          fi

          DEPLOYMENTS=$(curl -sS -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")

          # Cloudflare answers {"success": false, "errors": [...], "result": null}
          # on any failure. Iterating `.result[]` on that null killed the step with
          # `jq: error: Cannot iterate over null (null)` and exit 5, failing the
          # cleanup job on every PR close.
          if [ "$(echo "${DEPLOYMENTS}" | jq -r '.success // false')" != "true" ]; then
            echo "::warning::Cloudflare API call failed - skipping preview cleanup."
            echo "${DEPLOYMENTS}" | jq -r '.errors // [] | .[] | "  \(.code): \(.message)"'
            exit 0
          fi

          DEPLOYMENT_IDS=$(echo "${DEPLOYMENTS}" | jq -r --arg branch "${BRANCH}" \
            '(.result // [])[] | select(.deployment_trigger.metadata.branch == $branch) | .id')

          if [ -z "${DEPLOYMENT_IDS}" ]; then
            echo "No preview deployments found for branch ${BRANCH}."
            exit 0
          fi

          for id in ${DEPLOYMENT_IDS}; do
            echo "Deleting deployment: ${id}"
            curl -sS -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}/deployments/${id}?force=true" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" >/dev/null || \
              echo "::warning::Failed to delete deployment ${id}"
          done
