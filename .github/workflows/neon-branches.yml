name: Preview Deployment (Neon + Cloudflare Pages)

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.0.0'

jobs:
  deploy-preview:
    name: Deploy Preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ steps.branch_name.outputs.current_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Run Migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url_with_pooler }}

      - name: Build Frontend
        run: pnpm --filter @standard/web build
        env:
          VITE_NEON_AUTH_URL: https://ep-blue-breeze-anyfua57.neonauth.c-6.us-east-1.aws.neon.tech/neondb/auth
          VITE_API_URL: https://standard-api-gateway-production.ness.workers.dev
          VITE_NEON_DATA_API_URL: https://ep-blue-breeze-anyfua57.apirest.c-6.us-east-1.aws.neon.tech/neondb/rest/v1

      - name: Deploy Preview to Cloudflare Pages
        id: cf_deploy
        run: |
          DEPLOY_OUTPUT=$(wrangler pages deploy apps/web/dist \
            --project-name=standard-web-production \
            --branch=${{ steps.branch_name.outputs.current_branch }} 2>&1)
          echo "$DEPLOY_OUTPUT"
          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[^ ]*\.pages\.dev')
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Comment on PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## 🚀 Preview Deployment Ready

            | Resource | Link |
            |----------|------|
            | 🌐 Preview | ${{ steps.cf_deploy.outputs.preview_url }} |
            | 🗃️ Neon Branch | [preview/pr-${{ github.event.number }}](https://console.neon.tech/app/projects/${{ vars.NEON_PROJECT_ID }}/branches) |

            **Branch DB:** `preview/pr-${{ github.event.number }}-${{ steps.branch_name.outputs.current_branch }}`
          comment-tag: preview-deployment

  cleanup-preview:
    name: Cleanup Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ steps.branch_name.outputs.current_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Delete Cloudflare Pages Preview Deployments
        run: |
          BRANCH="${{ steps.branch_name.outputs.current_branch }}"
          PROJECT_NAME="standard-web-production"

          DEPLOYMENTS=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${PROJECT_NAME}/deployments" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")

          DEPLOYMENT_IDS=$(echo "$DEPLOYMENTS" | jq -r --arg branch "$BRANCH" \
            '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id')

          for id in $DEPLOYMENT_IDS; do
            echo "Deleting deployment: $id"
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${PROJECT_NAME}/deployments/${id}?force=true" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}"
          done
