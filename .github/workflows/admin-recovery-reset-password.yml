name: Admin Recovery — Reset Password

# Botão manual para repor a password de uma conta via o endpoint de recovery
# do API Gateway (POST /api/v1/admin/recovery/reset-password).
#
# Pré-requisitos (uma vez):
#   1. ADMIN_RECOVERY_SECRET definido no Worker de produção (destranca o endpoint).
#   2. O MESMO valor guardado como GitHub Actions secret `ADMIN_RECOVERY_SECRET`
#      (Settings → Secrets and variables → Actions → New repository secret).
#
# Uso: Actions → "Admin Recovery — Reset Password" → Run workflow → escreve o
# email da conta e a nova password (≥12 chars, com maiúscula, minúscula, dígito
# e símbolo). A password é validada e mascarada nos logs; NUNCA é escrita no
# Summary nem gerada pelo workflow — nenhuma credencial fica no histórico.
#
# O host de destino é FIXO (standard-api.bekaa.eu) para o segredo nunca poder
# ser enviado para um host arbitrário.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email da conta a repor"
        required: true
      new_password:
        description: "Nova password (≥12 chars, com maiúscula, minúscula, dígito e símbolo)"
        required: true

permissions:
  contents: read

jobs:
  reset-password:
    name: Repor password via recovery endpoint
    runs-on: ubuntu-latest
    # Gate de aprovação: configura este Environment em Settings → Environments
    # com "Required reviewers" para que o reset (que usa ADMIN_RECOVERY_SECRET)
    # só corra após aprovação manual.
    environment: admin-recovery-approval
    steps:
      - name: Reset
        env:
          ADMIN_RECOVERY_SECRET: ${{ secrets.ADMIN_RECOVERY_SECRET }}
          EMAIL: ${{ inputs.email }}
          INPUT_PASSWORD: ${{ inputs.new_password }}
        run: |
          set -euo pipefail

          # Host FIXO. NÃO usar input controlável pelo utilizador aqui: o payload
          # inclui ADMIN_RECOVERY_SECRET e um host arbitrário exfiltraria o segredo.
          API_BASE="https://standard-api.bekaa.eu"

          if [ -z "${ADMIN_RECOVERY_SECRET}" ]; then
            echo "::error::GitHub secret ADMIN_RECOVERY_SECRET não está definido. Adiciona-o em Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "::add-mask::${ADMIN_RECOVERY_SECRET}"

          # Mascara a password ANTES de qualquer uso, e valida-a com a MESMA
          # política de complexidade (a rota upstream só exige min(12)). A
          # password nunca é gerada nem escrita no Summary — é o operador que a
          # fornece, por isso já a conhece.
          echo "::add-mask::${INPUT_PASSWORD}"
          if [ "${#INPUT_PASSWORD}" -lt 12 ] \
            || ! printf '%s' "${INPUT_PASSWORD}" | grep -q '[A-Z]' \
            || ! printf '%s' "${INPUT_PASSWORD}" | grep -q '[a-z]' \
            || ! printf '%s' "${INPUT_PASSWORD}" | grep -q '[0-9]' \
            || ! printf '%s' "${INPUT_PASSWORD}" | grep -q '[^A-Za-z0-9]'; then
            echo "::error::A password deve ter ≥12 chars, com maiúscula, minúscula, dígito e símbolo."
            exit 1
          fi

          # Payload com escaping seguro via jq
          PAYLOAD="$(jq -nc \
            --arg e "${EMAIL}" \
            --arg p "${INPUT_PASSWORD}" \
            --arg s "${ADMIN_RECOVERY_SECRET}" \
            '{email:$e, newPassword:$p, recoverySecret:$s}')"

          HTTP_BODY="$(mktemp)"
          STATUS="$(curl -sS -o "${HTTP_BODY}" -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -X POST "${API_BASE}/api/v1/admin/recovery/reset-password" \
            -H 'Content-Type: application/json' \
            -d "${PAYLOAD}")"

          BODY="$(cat "${HTTP_BODY}")"
          echo "HTTP ${STATUS}"

          {
            echo "### Admin Recovery — Reset Password"
            echo ""
            echo "- **Email:** \`${EMAIL}\`"
            echo "- **Endpoint:** \`${API_BASE}/api/v1/admin/recovery/reset-password\`"
            echo "- **HTTP:** \`${STATUS}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${STATUS}" = "200" ]; then
            {
              echo "- **Resultado:** ✅ password reposta"
              echo ""
              echo "> Entra com a password que forneceste e **altera-a após o primeiro login**."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "OK — password reposta para ${EMAIL}"
          else
            {
              echo "- **Resultado:** ❌ falhou"
              echo "- **Resposta:** \`${BODY}\`"
              echo ""
              echo "> 501 = ADMIN_RECOVERY_SECRET não configurado no Worker · 403 = secret errado · 404 = utilizador não existe (usa o bootstrap-admin)."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::Reset falhou (HTTP ${STATUS}): ${BODY}"
            exit 1
          fi
