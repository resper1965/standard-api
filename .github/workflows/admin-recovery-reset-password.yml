name: Admin Recovery — Reset Password

# Botão manual para repor a password de uma conta via o endpoint de recovery
# do API Gateway (POST /api/v1/admin/recovery/reset-password).
#
# Pré-requisitos (uma vez):
#   1. ADMIN_RECOVERY_SECRET definido no Worker de produção (destranca o endpoint).
#   2. O MESMO valor guardado como GitHub Actions secret `ADMIN_RECOVERY_SECRET`
#      (Settings → Secrets and variables → Actions → New repository secret).
#
# Uso: Actions → "Admin Recovery — Reset Password" → Run workflow → preenche o
# email (default resper@bekaa.eu). Deixa a password em branco para gerar uma
# automaticamente — ela aparece no resumo da execução (Summary).

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email da conta a repor"
        required: true
        default: "resper@bekaa.eu"
      api_base:
        description: "Base URL do API Gateway"
        required: true
        default: "https://standard-api.bekaa.eu"
      new_password:
        description: "Nova password (deixa em branco para gerar; ≥12, A-z 0-9 símbolo)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  reset-password:
    name: Repor password via recovery endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Reset
        env:
          ADMIN_RECOVERY_SECRET: ${{ secrets.ADMIN_RECOVERY_SECRET }}
          EMAIL: ${{ inputs.email }}
          API_BASE: ${{ inputs.api_base }}
          INPUT_PASSWORD: ${{ inputs.new_password }}
        run: |
          set -euo pipefail

          if [ -z "${ADMIN_RECOVERY_SECRET}" ]; then
            echo "::error::GitHub secret ADMIN_RECOVERY_SECRET não está definido. Adiciona-o em Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "::add-mask::${ADMIN_RECOVERY_SECRET}"

          # Password: usa a fornecida ou gera uma compatível com a política
          # (maiúscula, minúscula, dígito, símbolo, ≥12 chars).
          if [ -n "${INPUT_PASSWORD}" ]; then
            NEWPASS="${INPUT_PASSWORD}"
            GENERATED="false"
          else
            BASE="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9')"
            NEWPASS="Aa1!${BASE:0:18}"
            GENERATED="true"
          fi

          # Payload com escaping seguro via jq
          PAYLOAD="$(jq -nc \
            --arg e "${EMAIL}" \
            --arg p "${NEWPASS}" \
            --arg s "${ADMIN_RECOVERY_SECRET}" \
            '{email:$e, newPassword:$p, recoverySecret:$s}')"

          HTTP_BODY="$(mktemp)"
          STATUS="$(curl -sS -o "${HTTP_BODY}" -w '%{http_code}' \
            -X POST "${API_BASE}/api/v1/admin/recovery/reset-password" \
            -H 'Content-Type: application/json' \
            -d "${PAYLOAD}")"

          BODY="$(cat "${HTTP_BODY}")"
          echo "HTTP ${STATUS}"

          {
            echo "### Admin Recovery — Reset Password"
            echo ""
            echo "- **Email:** \`${EMAIL}\`"
            echo "- **Endpoint:** \`${API_BASE}/api/v1/admin/recovery/reset-password\`"
            echo "- **HTTP:** \`${STATUS}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${STATUS}" = "200" ]; then
            {
              echo "- **Resultado:** ✅ password reposta"
              if [ "${GENERATED}" = "true" ]; then
                echo "- **Password gerada:** \`${NEWPASS}\`"
                echo ""
                echo "> ⚠️ Guarda esta password e **altera-a após o primeiro login**. Este resumo fica no histórico das Actions."
              else
                echo ""
                echo "> Usaste uma password fornecida manualmente."
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "OK — password reposta para ${EMAIL}"
          else
            {
              echo "- **Resultado:** ❌ falhou"
              echo "- **Resposta:** \`${BODY}\`"
              echo ""
              echo "> 501 = ADMIN_RECOVERY_SECRET não configurado no Worker · 403 = secret errado · 404 = utilizador não existe (usa o bootstrap-admin)."
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::Reset falhou (HTTP ${STATUS}): ${BODY}"
            exit 1
          fi
