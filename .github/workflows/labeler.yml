name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs: a new push to the same PR makes the previous run's
# result irrelevant, and once this repository is private those minutes are
# metered. `github.ref` keeps concurrent PRs independent of each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
