name: Context Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs: a new push to the same PR makes the previous run's
# result irrelevant, and once this repository is private those minutes are
# metered. `github.ref` keeps concurrent PRs independent of each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-check:
    name: Verify context preservation
    runs-on: ubuntu-latest

    steps:
      - name: Check changed context files
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh pr diff` resolves the target repo from the local git remote, and
          # this job deliberately does no checkout — without GH_REPO it dies with
          # "fatal: not a git repository" before ever reading the diff, failing
          # every PR regardless of content. Cheaper than adding a checkout step.
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          combined_text="${PR_TITLE} ${PR_BODY}"

          if [[ "${combined_text}" == *"[no-context-change]"* ]]; then
            echo "Context check skipped because PR contains [no-context-change]."
            exit 0
          fi

          changed_files="$(gh pr diff "${PR_NUMBER}" --name-only)"

          echo "Changed files:"
          echo "${changed_files}"

          context_pattern='^(CONTEXT\.md|DEVELOPMENT\.md|DECISIONS\.md|docs/|adr/|prompts/|tasks/|\.agent/)'

          if echo "${changed_files}" | grep -Eq "${context_pattern}"; then
            echo "Context preservation check passed."
            exit 0
          fi

          echo "::error title=Contexto obrigatório não atualizado::Este PR não altera arquivos de contexto. Atualize CONTEXT.md, DEVELOPMENT.md, DECISIONS.md, docs/, adr/, prompts/, tasks/ ou .agent/ quando houver contexto relevante. Se a mudança realmente não exige contexto, inclua [no-context-change] no título ou descrição do PR com justificativa."
          exit 1
