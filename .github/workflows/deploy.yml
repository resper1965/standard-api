name: CI Pipeline

# Least privilege: this pipeline only builds and tests, so the token needs
# nothing beyond reading the repository. Without an explicit block the job
# inherits the repository default, which can be read/write on all scopes.
permissions:
  contents: read

# Cancel superseded runs: a new push to the same PR makes the previous run's
# result irrelevant, and once this repository is private those minutes are
# metered. `github.ref` keeps concurrent PRs independent of each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Install pnpm
        # pnpm/action-setup@v3.0.0 — pinned to commit hash (supply chain security)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @standard/sdk build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test
