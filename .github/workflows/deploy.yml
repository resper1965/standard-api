name: CI Pipeline

# Least privilege: this pipeline only builds and tests, so the token needs
# nothing beyond reading the repository. Without an explicit block the job
# inherits the repository default, which can be read/write on all scopes.
permissions:
  contents: read

# Cancel superseded runs: a new push to the same PR makes the previous run's
# result irrelevant, and once this repository is private those minutes are
# metered. `github.ref` keeps concurrent PRs independent of each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install pnpm
        # pnpm/action-setup@v3.0.0 — pinned to commit hash (supply chain security)
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @standard/sdk build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test
