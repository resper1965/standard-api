version: 2
updates:
  # ─── npm (pnpm) dependencies ──────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # Security patches stay on their own so they are never queued behind a
      # routine version sweep — better-auth's account-takeover advisory sat in
      # an unreviewed PR (#118) for a month while it was grouped with the rest.
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "deps"
      include: "scope"

  # ─── GitHub Actions ───────────────────────────────────────────
  # Grouped: ungrouped action bumps produced five separate open PRs
  # (checkout, setup-node, cache, pnpm/action-setup, codeql-action), each
  # needing its own review cycle for what is really one routine sweep.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    labels: ["ci", "automated"]
    commit-message:
      prefix: "ci"

  # ─── Docker (infra) ──────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule:
      interval: "monthly"
    labels: ["infrastructure", "automated"]
    commit-message:
      prefix: "infra"
