# Configuration for actions/labeler v5+.
#
# The previous file used the `version:` / `labels:` / `matcher:` shape from a
# different labeler action, so v5 read the top-level `version` key as a label
# name and failed every run with:
#   found unexpected type for label 'version' (should be array of config options)
#
# v5 expects: <label-name>: - changed-files: - any-glob-to-any-file: [...]
# `sync-labels: true` is set on the workflow step, so per-label `sync` is gone.

api-gateway:
  - changed-files:
      - any-glob-to-any-file: ["apps/api-gateway/**"]

frontend:
  - changed-files:
      - any-glob-to-any-file: ["apps/web/**"]

packages:
  - changed-files:
      - any-glob-to-any-file: ["packages/**"]

workers:
  - changed-files:
      - any-glob-to-any-file: ["workers/**"]

infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - "infra/**"
          - ".github/workflows/**"
          - "**/*.toml"

security:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/security/**"
          - "SECURITY.md"
          - ".github/workflows/security-scan.yml"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"
          - "adr/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "evals/**"
          - "**/*.test.ts"

agent-runtime:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/agent-runtime/**"
          - "prompts/**"

scf:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/scf-core/**"
          - "packages/scf-catalog/**"

assessment:
  - changed-files:
      - any-glob-to-any-file:
          - "packages/assessment-engine/**"
          - "packages/soa/**"
          - "packages/gap-analysis/**"
          - "packages/poam/**"
