name = "standard-queues"
main = "../../workers/queues/src/index.ts"
compatibility_date = "2026-04-28"
compatibility_flags = [ "nodejs_compat" ]


[vars]
STANDARD_ENV = "development"
LOG_LEVEL = "info"
AI_GATEWAY_NAME = "standard-dev"
AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/0a6c490dd5fe9051422c15c9e133138e/standard-dev"

[[queues.consumers]]
queue = "standard-kb-embedding-dev"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "standard-dead-letter-dev"

[[queues.consumers]]
queue = "standard-report-export-dev"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "standard-dead-letter-dev"

[[queues.consumers]]
queue = "standard-agent-run-dev"
max_batch_size = 5
max_batch_timeout = 60
max_retries = 5
dead_letter_queue = "standard-dead-letter-dev"

[[queues.consumers]]
queue = "standard-document-ingestion-dev"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "standard-dead-letter-dev"

[[queues.consumers]]
queue = "standard-soc-triage-dev"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "standard-dead-letter-dev"

[[queues.consumers]]
queue = "standard-user-lifecycle-dev"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "standard-dead-letter-dev"

# Dead Letter Queue consumer — receives messages that exhausted all retries.
[[queues.consumers]]
queue = "standard-dead-letter-dev"
max_batch_size = 20
max_batch_timeout = 60
max_retries = 1

[[r2_buckets]]
binding = "STANDARD_DOCUMENTS_BUCKET"
bucket_name = "standard-documents-dev"

[[r2_buckets]]
binding = "STANDARD_REPORTS_BUCKET"
bucket_name = "standard-reports-dev"

[[r2_buckets]]
binding = "STANDARD_EXPORTS_BUCKET"
bucket_name = "standard-exports-dev"

[[vectorize]]
binding = "STANDARD_KB_INDEX"
index_name = "standard-kb-dev"

[[kv_namespaces]]
binding = "STANDARD_CACHE"
id = "55f97abbf9794b0196bdf51e8c1dedec"

[ai]
binding = "AI"

[triggers]
crons = ["0 2 * * SUN"]

