name = "standard-reporting-worker"
main = "../../workers/queues/src/index.ts"
compatibility_date = "2026-04-28"
compatibility_flags = [ "nodejs_compat" ]

[vars]
STANDARD_ENV = "development"
LOG_LEVEL = "info"
AI_GATEWAY_NAME = "standard-dev"
AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/0a6c490dd5fe9051422c15c9e133138e/standard-dev"

[[queues.consumers]]
queue = "standard-report-export-dev"
max_batch_size = 5
max_batch_timeout = 30
dead_letter_queue = "standard-dead-letter-dev"

[[r2_buckets]]
binding = "STANDARD_REPORTS_BUCKET"
bucket_name = "standard-reports-dev"

[[r2_buckets]]
binding = "STANDARD_EXPORTS_BUCKET"
bucket_name = "standard-exports-dev"

[env.staging]
name = "standard-reporting-worker-staging"
vars = { STANDARD_ENV = "staging", LOG_LEVEL = "info", AI_GATEWAY_NAME = "standard-staging", AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/0a6c490dd5fe9051422c15c9e133138e/standard-staging" }

[[env.staging.queues.consumers]]
queue = "standard-report-export-staging"
max_batch_size = 5
max_batch_timeout = 30
dead_letter_queue = "standard-dead-letter-staging"

[[env.staging.r2_buckets]]
binding = "STANDARD_REPORTS_BUCKET"
bucket_name = "standard-reports-staging"

[[env.staging.r2_buckets]]
binding = "STANDARD_EXPORTS_BUCKET"
bucket_name = "standard-exports-staging"

[env.production]
name = "standard-reporting-worker-production"
vars = { STANDARD_ENV = "production", LOG_LEVEL = "warn", AI_GATEWAY_NAME = "standard-prod", AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/0a6c490dd5fe9051422c15c9e133138e/standard-prod" }

[[env.production.queues.consumers]]
queue = "standard-report-export-prod"
max_batch_size = 5
max_batch_timeout = 30
dead_letter_queue = "standard-dead-letter-prod"

[[env.production.r2_buckets]]
binding = "STANDARD_REPORTS_BUCKET"
bucket_name = "standard-reports-prod"

[[env.production.r2_buckets]]
binding = "STANDARD_EXPORTS_BUCKET"
bucket_name = "standard-exports-prod"


