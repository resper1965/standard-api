name = "aegis-api-standard-workflows"
main = "../../workers/workflows/src/assessment-lifecycle.ts"
compatibility_date = "2026-04-28"

[vars]
AEGIS_ENV = "development"
LOG_LEVEL = "info"

[[workflows]]
binding = "ASSESSMENT_WORKFLOW"
name = "aegis-assessment-lifecycle-dev"
class_name = "AssessmentLifecycleWorkflow"

[env.staging]
name = "aegis-api-standard-workflows-staging"
vars = { AEGIS_ENV = "staging", LOG_LEVEL = "info" }

[[env.staging.workflows]]
binding = "ASSESSMENT_WORKFLOW"
name = "aegis-assessment-lifecycle-staging"
class_name = "AssessmentLifecycleWorkflow"

[env.production]
name = "aegis-api-standard-workflows-production"
vars = { AEGIS_ENV = "production", LOG_LEVEL = "warn" }

[[env.production.workflows]]
binding = "ASSESSMENT_WORKFLOW"
name = "aegis-assessment-lifecycle-prod"
class_name = "AssessmentLifecycleWorkflow"
