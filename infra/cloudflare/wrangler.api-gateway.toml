name = "aegis-api-standard-api-gateway"
main = "../../apps/api-gateway/src/index.ts"
compatibility_date = "2026-04-28"

[vars]
AEGIS_ENV = "development"
LOG_LEVEL = "info"
AI_GATEWAY_NAME = "aegis-dev"
AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/${CLOUDFLARE_ACCOUNT_ID}/aegis-dev"

[[r2_buckets]]
binding = "AEGIS_DOCUMENTS_BUCKET"
bucket_name = "aegis-documents-prod"

[[r2_buckets]]
binding = "AEGIS_REPORTS_BUCKET"
bucket_name = "aegis-reports-prod"

[[r2_buckets]]
binding = "AEGIS_EXPORTS_BUCKET"
bucket_name = "aegis-exports-prod"

[[queues.producers]]
binding = "DOCUMENT_INGESTION_QUEUE"
queue = "aegis-document-ingestion-dev"

[[queues.producers]]
binding = "KB_EMBEDDING_QUEUE"
queue = "aegis-kb-embedding-dev"

[[queues.producers]]
binding = "REPORT_EXPORT_QUEUE"
queue = "aegis-report-export-dev"

[[queues.producers]]
binding = "AGENT_TASK_QUEUE"
queue = "aegis-agent-task-dev"

[[kv_namespaces]]
binding = "AEGIS_CONFIG_KV"
id = "e7aba96b342b4060ab3869ca7789832d"

[[kv_namespaces]]
binding = "AEGIS_FEATURE_FLAGS_KV"
id = "23e073ec707d4803a8957e13a4046810"

[[kv_namespaces]]
binding = "AEGIS_CACHE_KV"
id = "55f97abbf9794b0196bdf51e8c1dedec"

[[workflows]]
binding = "ASSESSMENT_WORKFLOW"
name = "aegis-assessment-lifecycle-dev"
class_name = "AssessmentLifecycleWorkflow"
script_name = "aegis-api-standard-workflows"

[env.staging]
name = "aegis-api-standard-api-gateway-staging"

[env.staging.vars]
AEGIS_ENV = "staging"
LOG_LEVEL = "info"
AI_GATEWAY_NAME = "aegis-staging"
AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/${CLOUDFLARE_ACCOUNT_ID}/aegis-staging"

[[env.staging.r2_buckets]]
binding = "AEGIS_DOCUMENTS_BUCKET"
bucket_name = "aegis-documents-staging"

[[env.staging.r2_buckets]]
binding = "AEGIS_REPORTS_BUCKET"
bucket_name = "aegis-reports-staging"

[[env.staging.r2_buckets]]
binding = "AEGIS_EXPORTS_BUCKET"
bucket_name = "aegis-exports-staging"

[[env.staging.queues.producers]]
binding = "DOCUMENT_INGESTION_QUEUE"
queue = "aegis-document-ingestion-staging"

[[env.staging.queues.producers]]
binding = "KB_EMBEDDING_QUEUE"
queue = "aegis-kb-embedding-staging"

[[env.staging.queues.producers]]
binding = "REPORT_EXPORT_QUEUE"
queue = "aegis-report-export-staging"

[[env.staging.queues.producers]]
binding = "AGENT_TASK_QUEUE"
queue = "aegis-agent-task-staging"

[[env.staging.kv_namespaces]]
binding = "AEGIS_CONFIG_KV"
id = "replace-with-staging-config-kv-id"

[[env.staging.kv_namespaces]]
binding = "AEGIS_FEATURE_FLAGS_KV"
id = "replace-with-staging-feature-flags-kv-id"

[[env.staging.kv_namespaces]]
binding = "AEGIS_CACHE_KV"
id = "replace-with-staging-cache-kv-id"

[[env.staging.workflows]]
binding = "ASSESSMENT_WORKFLOW"
name = "aegis-assessment-lifecycle-staging"
class_name = "AssessmentLifecycleWorkflow"
script_name = "aegis-api-standard-workflows-staging"

[env.production]
name = "aegis-api-standard-api-gateway-production"

[env.production.vars]
AEGIS_ENV = "production"
LOG_LEVEL = "warn"
AI_GATEWAY_NAME = "aegis-prod"
AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/${CLOUDFLARE_ACCOUNT_ID}/aegis-prod"

[[env.production.r2_buckets]]
binding = "AEGIS_DOCUMENTS_BUCKET"
bucket_name = "aegis-documents-prod"

[[env.production.r2_buckets]]
binding = "AEGIS_REPORTS_BUCKET"
bucket_name = "aegis-reports-prod"

[[env.production.r2_buckets]]
binding = "AEGIS_EXPORTS_BUCKET"
bucket_name = "aegis-exports-prod"

[[env.production.queues.producers]]
binding = "DOCUMENT_INGESTION_QUEUE"
queue = "aegis-document-ingestion-prod"

[[env.production.queues.producers]]
binding = "KB_EMBEDDING_QUEUE"
queue = "aegis-kb-embedding-prod"

[[env.production.queues.producers]]
binding = "REPORT_EXPORT_QUEUE"
queue = "aegis-report-export-prod"

[[env.production.queues.producers]]
binding = "AGENT_TASK_QUEUE"
queue = "aegis-agent-task-prod"

[[env.production.kv_namespaces]]
binding = "AEGIS_CONFIG_KV"
id = "e7aba96b342b4060ab3869ca7789832d"

[[env.production.kv_namespaces]]
binding = "AEGIS_FEATURE_FLAGS_KV"
id = "23e073ec707d4803a8957e13a4046810"

[[env.production.kv_namespaces]]
binding = "AEGIS_CACHE_KV"
id = "55f97abbf9794b0196bdf51e8c1dedec"

[[env.production.workflows]]
binding = "ASSESSMENT_WORKFLOW"
name = "aegis-assessment-lifecycle-prod"
class_name = "AssessmentLifecycleWorkflow"
script_name = "aegis-api-standard-workflows-production"
