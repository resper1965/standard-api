services:
  postgres:
    image: postgres:16-alpine
    container_name: standard-postgres
    environment:
      POSTGRES_DB: standard
      POSTGRES_USER: standard
      POSTGRES_PASSWORD: standard_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/migrations:/docker-entrypoint-initdb.d:ro
      - ./postgres/seeds/0001_synthetic_seed.sql:/docker-entrypoint-initdb.d/901_synthetic_seed.sql:ro
      - ./postgres/seeds/0002_synthetic_scf_seed.sql:/docker-entrypoint-initdb.d/902_synthetic_scf_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standard -d standard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

