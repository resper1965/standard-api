name = "standard-api-gateway"
main = "src/index.ts"
compatibility_date = "2026-04-28"
compatibility_flags = ["nodejs_compat"]

[vars]
STANDARD_ENV = "development"
LOG_LEVEL = "info"
AI_GATEWAY_NAME = "standard-dev"
AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/0a6c490dd5fe9051422c15c9e133138e/standard-dev/compat"
# Better Auth — SECRET must be set via `wrangler secret put BETTER_AUTH_SECRET` for production
# For local dev, this placeholder is overridden by .dev.vars
BETTER_AUTH_URL = "https://standard-api.bekaa.eu"
# Comma-separated allowed CORS origins — override via wrangler secret or env var
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:3000"
# Better Auth org slug for the platform-admin (Bekaa operator) org.
# Platform admins without an active session org are auto-scoped to this org.
PLATFORM_ADMIN_ORG_SLUG = "bekaa"

[[r2_buckets]]
binding = "STANDARD_DOCUMENTS_BUCKET"
bucket_name = "standard-documents-dev"

[[r2_buckets]]
binding = "STANDARD_REPORTS_BUCKET"
bucket_name = "standard-reports-dev"

[[r2_buckets]]
binding = "STANDARD_EXPORTS_BUCKET"
bucket_name = "standard-exports-dev"

[[queues.producers]]
binding = "DOCUMENT_INGESTION_QUEUE"
queue = "standard-document-ingestion-dev"

[[queues.producers]]
binding = "KB_EMBEDDING_QUEUE"
queue = "standard-kb-embedding-dev"

[[queues.producers]]
binding = "REPORT_EXPORT_QUEUE"
queue = "standard-report-export-dev"

[[queues.producers]]
binding = "AGENT_RUN_QUEUE"
queue = "standard-agent-run-dev"

# ─── SOC Triage Queue (Background AI processing) ───────────
[[queues.producers]]
binding = "SOC_TRIAGE_QUEUE"
queue = "standard-soc-triage-dev"


# ─── Email Service (send transactional emails) ─────────────────
[[send_email]]
name = "EMAIL"
remote = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "STANDARD_CACHE"
id = "4e027e07e0e5440a8666c3f8ee419333"
# preview_id is used by `wrangler dev` — isolated from production.
# Namespace: standard-api-gateway-STANDARD_CACHE_preview
preview_id = "d8a6d449689a47a5ae1ee5cec1f6ec8d"

[[vectorize]]
binding = "STANDARD_KB_INDEX"
index_name = "standard-kb-dev"

# ─── Cloudflare Workflows (durable assessment lifecycle orchestration) ─────
# Prerequisite: deploy workers/workflows worker first:
#   cd workers/workflows && wrangler deploy
# These bindings connect the API gateway to the durable workflow engine.
[[workflows]]
binding = "ASSESSMENT_WORKFLOW"
name = "standard-assessment-lifecycle-dev"
class_name = "AssessmentLifecycleWorkflow"
script_name = "standard-workflows"

[[workflows]]
binding = "COUNCIL_WORKFLOW"
name = "standard-council-orchestration-dev"
class_name = "CouncilOrchestrationWorkflow"
script_name = "standard-workflows"
# ─── Production environment ────────────────────────────────────
[env.production]
workers_dev = true
vars = { STANDARD_ENV = "production", BETTER_AUTH_URL = "https://standard-api.bekaa.eu", LOG_LEVEL = "info", AI_GATEWAY_NAME = "standard-prod", AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/0a6c490dd5fe9051422c15c9e133138e/standard-prod/compat", ALLOWED_ORIGINS = "https://standard.bekaa.eu,https://standard-web.pages.dev,https://production.standard-web.pages.dev", PLATFORM_ADMIN_ORG_SLUG = "bekaa" }
routes = [{ pattern = "standard-api.bekaa.eu", custom_domain = true }]

[[env.production.r2_buckets]]
binding = "STANDARD_DOCUMENTS_BUCKET"
bucket_name = "standard-documents-prod"

[[env.production.r2_buckets]]
binding = "STANDARD_REPORTS_BUCKET"
bucket_name = "standard-reports-prod"

[[env.production.r2_buckets]]
binding = "STANDARD_EXPORTS_BUCKET"
bucket_name = "standard-exports-prod"

[[env.production.queues.producers]]
binding = "DOCUMENT_INGESTION_QUEUE"
queue = "standard-document-ingestion-prod"

[[env.production.queues.producers]]
binding = "KB_EMBEDDING_QUEUE"
queue = "standard-kb-embedding-prod"

[[env.production.queues.producers]]
binding = "REPORT_EXPORT_QUEUE"
queue = "standard-report-export-prod"

[[env.production.queues.producers]]
binding = "AGENT_RUN_QUEUE"
queue = "standard-agent-run-prod"

[[env.production.queues.producers]]
binding = "SOC_TRIAGE_QUEUE"
queue = "standard-soc-triage-prod"


[env.production.ai]
binding = "AI"

[[env.production.kv_namespaces]]
binding = "STANDARD_CACHE"
id = "55f97abbf9794b0196bdf51e8c1dedec"

[[env.production.vectorize]]
binding = "STANDARD_KB_INDEX"
index_name = "standard-kb-prod"

[[env.production.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@bekaa.eu"]

# ─── Production Workflows bindings ─────────────────────────────
[[env.production.workflows]]
binding = "ASSESSMENT_WORKFLOW"
name = "standard-assessment-lifecycle-production"
class_name = "AssessmentLifecycleWorkflow"
script_name = "standard-workflows"

[[env.production.workflows]]
binding = "COUNCIL_WORKFLOW"
name = "standard-council-orchestration-production"
class_name = "CouncilOrchestrationWorkflow"
script_name = "standard-workflows"
