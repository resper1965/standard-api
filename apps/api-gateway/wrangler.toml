name = "standard-api-gateway"
main = "../../apps/api-gateway/src/index.ts"
compatibility_date = "2026-04-28"
compatibility_flags = [ "nodejs_compat" ]

[vars]
STANDARD_ENV = "development"
# Emails sempre tratados como platform admin (CSV). Não é segredo — versionado
# aqui de propósito. Lista exaustiva: se editares, inclui todos os admins.
PLATFORM_ADMIN_EMAILS = "resper@bekaa.eu"
LOG_LEVEL = "info"
AI_GATEWAY_NAME = "standard-dev"
AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/0a6c490dd5fe9051422c15c9e133138e/standard-dev"

[[r2_buckets]]
binding = "STANDARD_DOCUMENTS_BUCKET"
bucket_name = "standard-documents-dev"

[[r2_buckets]]
binding = "STANDARD_REPORTS_BUCKET"
bucket_name = "standard-reports-dev"

[[r2_buckets]]
binding = "STANDARD_EXPORTS_BUCKET"
bucket_name = "standard-exports-dev"

[[queues.producers]]
binding = "DOCUMENT_INGESTION_QUEUE"
queue = "standard-document-ingestion-dev"

[[queues.producers]]
binding = "KB_EMBEDDING_QUEUE"
queue = "standard-kb-embedding-dev"

[[queues.producers]]
binding = "REPORT_EXPORT_QUEUE"
queue = "standard-report-export-dev"

[[queues.producers]]
binding = "AGENT_RUN_QUEUE"
queue = "standard-agent-run-dev"

[[queues.producers]]
binding = "USER_LIFECYCLE_QUEUE"
queue = "standard-user-lifecycle-dev"

[[queues.producers]]
binding = "AGENT_USAGE_QUEUE"
queue = "standard-agent-usage-dev"

[[kv_namespaces]]
binding = "STANDARD_CONFIG_KV"
id = "d780e8372a814b049d7283bfdd022d55"

[[kv_namespaces]]
binding = "STANDARD_FEATURE_FLAGS_KV"
id = "d57b7c1c18f744a8ab8b8fcafa84bc9d"

[[kv_namespaces]]
binding = "STANDARD_CACHE"
id = "d94323d4e27d4b92994c89d412d27f74"

[[workflows]]
binding = "ASSESSMENT_WORKFLOW"
name = "standard-assessment-lifecycle-dev"
class_name = "AssessmentLifecycleWorkflow"
script_name = "standard-workflows"

[[workflows]]
binding = "COUNCIL_WORKFLOW"
name = "standard-council-orchestration-dev"
class_name = "CouncilOrchestrationWorkflow"
script_name = "standard-workflows"

# Hyperdrive — product Neon branch (SCF, assessments, findings)
# Local dev uses DATABASE_URL directly via miniflare — no Hyperdrive needed locally

# Auth Neon branch — control plane (user, org, api_keys)
[[hyperdrive]]
binding = "HYPERDRIVE_AUTH"
id = "0cdc4cfbf47a472fb1fda01d5987499c"
# Usado somente por `wrangler dev` (ignorado em deploy). Sem isto o dev local
# aborta. Aponta para o Postgres de infra/docker: local o auth vive no mesmo
# banco, conforme o fallback AUTH_DATABASE_URL || DATABASE_URL.
localConnectionString = "postgres://standard:standard_dev_password@localhost:5432/standard"

[[durable_objects.bindings]]
name = "ASSESSMENT_SESSION_DO"
class_name = "AssessmentSessionDO"

[[migrations]]
tag = "v1"
new_classes = ["AssessmentSessionDO"]

[env.staging]
name = "standard-api-gateway-staging"

[env.staging.vars]
STANDARD_ENV = "staging"
PLATFORM_ADMIN_EMAILS = "resper@bekaa.eu"
LOG_LEVEL = "info"
AI_GATEWAY_NAME = "standard-staging"
AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/0a6c490dd5fe9051422c15c9e133138e/standard-staging"
BETTER_AUTH_URL = "https://standard-api.bekaa.eu/api/auth"

[[env.staging.r2_buckets]]
binding = "STANDARD_DOCUMENTS_BUCKET"
bucket_name = "standard-documents-staging"

[[env.staging.r2_buckets]]
binding = "STANDARD_REPORTS_BUCKET"
bucket_name = "standard-reports-staging"

[[env.staging.r2_buckets]]
binding = "STANDARD_EXPORTS_BUCKET"
bucket_name = "standard-exports-staging"

[[env.staging.queues.producers]]
binding = "DOCUMENT_INGESTION_QUEUE"
queue = "standard-document-ingestion-staging"

[[env.staging.queues.producers]]
binding = "KB_EMBEDDING_QUEUE"
queue = "standard-kb-embedding-staging"

[[env.staging.queues.producers]]
binding = "REPORT_EXPORT_QUEUE"
queue = "standard-report-export-staging"

[[env.staging.queues.producers]]
binding = "AGENT_RUN_QUEUE"
queue = "standard-agent-run-staging"

[[env.staging.queues.producers]]
binding = "USER_LIFECYCLE_QUEUE"
queue = "standard-user-lifecycle-staging"

[[env.staging.queues.producers]]
binding = "AGENT_USAGE_QUEUE"
queue = "standard-agent-usage-staging"

[[env.staging.kv_namespaces]]
binding = "STANDARD_CONFIG_KV"
id = "1780e8372a814b049d7283bfdd022d55"

[[env.staging.kv_namespaces]]
binding = "STANDARD_FEATURE_FLAGS_KV"
id = "757b7c1c18f744a8ab8b8fcafa84bc9d"

[[env.staging.kv_namespaces]]
binding = "STANDARD_CACHE"
id = "094323d4e27d4b92994c89d412d27f74"

# Hyperdrive — product branch (staging)
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "69f8233cfd0f4614a9249e4a8867d148"

# Auth branch (staging) — create with:
# npx wrangler hyperdrive create standard-neon-auth-staging --connection-string="<AUTH_STAGING_URL>"
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE_AUTH"
id = "REPLACE_WITH_AUTH_STAGING_HYPERDRIVE_ID"

[[env.staging.durable_objects.bindings]]
name = "ASSESSMENT_SESSION_DO"
class_name = "AssessmentSessionDO"

[[env.staging.workflows]]
binding = "ASSESSMENT_WORKFLOW"
name = "standard-assessment-lifecycle-staging"
class_name = "AssessmentLifecycleWorkflow"
script_name = "standard-workflows-staging"

[[env.staging.workflows]]
binding = "COUNCIL_WORKFLOW"
name = "standard-council-orchestration-staging"
class_name = "CouncilOrchestrationWorkflow"
script_name = "standard-workflows-staging"

[env.production]
name = "standard-api-gateway-production"
routes = [
  { pattern = "standard-api.bekaa.eu", custom_domain = true }
]


[env.production.vars]
STANDARD_ENV = "production"
PLATFORM_ADMIN_EMAILS = "resper@bekaa.eu"
LOG_LEVEL = "warn"
AI_GATEWAY_NAME = "standard-prod"
AI_GATEWAY_BASE_URL = "https://gateway.ai.cloudflare.com/v1/0a6c490dd5fe9051422c15c9e133138e/standard-prod"
BETTER_AUTH_URL = "https://standard-api.bekaa.eu/api/auth"

[[env.production.r2_buckets]]
binding = "STANDARD_DOCUMENTS_BUCKET"
bucket_name = "standard-documents-prod"

[[env.production.r2_buckets]]
binding = "STANDARD_REPORTS_BUCKET"
bucket_name = "standard-reports-prod"

[[env.production.r2_buckets]]
binding = "STANDARD_EXPORTS_BUCKET"
bucket_name = "standard-exports-prod"

[[env.production.queues.producers]]
binding = "DOCUMENT_INGESTION_QUEUE"
queue = "standard-document-ingestion-prod"

[[env.production.queues.producers]]
binding = "KB_EMBEDDING_QUEUE"
queue = "standard-kb-embedding-prod"

[[env.production.queues.producers]]
binding = "REPORT_EXPORT_QUEUE"
queue = "standard-report-export-prod"

[[env.production.queues.producers]]
binding = "AGENT_RUN_QUEUE"
queue = "standard-agent-run-prod"

[[env.production.queues.producers]]
binding = "USER_LIFECYCLE_QUEUE"
queue = "standard-user-lifecycle-prod"

[[env.production.queues.producers]]
binding = "AGENT_USAGE_QUEUE"
queue = "standard-agent-usage-prod"

[[env.production.kv_namespaces]]
binding = "STANDARD_CONFIG_KV"
id = "e7aba96b342b4060ab3869ca7789832d"

[[env.production.kv_namespaces]]
binding = "STANDARD_FEATURE_FLAGS_KV"
id = "23e073ec707d4803a8957e13a4046810"

[[env.production.kv_namespaces]]
binding = "STANDARD_CACHE"
id = "55f97abbf9794b0196bdf51e8c1dedec"

# Hyperdrive is incompatible with @neondatabase/serverless poolQueryViaFetch=true mode
# because Hyperdrive proxies TCP, but neon-serverless tries to use HTTP over the hyperdrive hostname.
# [[env.production.hyperdrive]]
# binding = "HYPERDRIVE"
# id = "aa6fb63a67f24cbd82d28bf5a43f08e5"

# [[env.production.hyperdrive]]
# binding = "HYPERDRIVE_AUTH"
# id = "0c46c5955a0c42f0aea3c24facb5bf39"

[[env.production.durable_objects.bindings]]
name = "ASSESSMENT_SESSION_DO"
class_name = "AssessmentSessionDO"

[[env.production.workflows]]
binding = "ASSESSMENT_WORKFLOW"
name = "standard-assessment-lifecycle-prod"
class_name = "AssessmentLifecycleWorkflow"
script_name = "standard-workflows-production"

[[env.production.workflows]]
binding = "COUNCIL_WORKFLOW"
name = "standard-council-orchestration-production"
class_name = "CouncilOrchestrationWorkflow"
script_name = "standard-workflows-production"


# Custom domain: standard-api.bekaa.eu is configured via routes in [env.production] above.
